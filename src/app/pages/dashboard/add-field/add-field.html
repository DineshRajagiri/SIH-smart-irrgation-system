<div class="card add-field-card">


  <div class="card-content">
    <form (ngSubmit)="onAddField()" #fieldForm="ngForm" class="form">
      <div class="form-group">
        <label for="fieldName">Field Name</label>
        <input
          type="text"
          id="fieldName"
          [(ngModel)]="fieldName"
          name="fieldName"
          placeholder="e.g., North Field"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="form-group">
        <label for="fieldLocation">Location</label>
        <input
          type="text"
          id="fieldLocation"
          [(ngModel)]="fieldLocation"
          name="fieldLocation"
          placeholder="e.g., Plot A, Sector 5"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="form-group">
        <label for="fieldArea">Area (hectares)</label>
        <input
          type="number"
          id="fieldArea"
          [(ngModel)]="fieldArea"
          name="fieldArea"
          placeholder="e.g., 5"
          [disabled]="isSubmitting"
        />
      </div>

      <div class="form-group">
        <label for="soilType">Soil Type</label>
        <select
          id="soilType"
          [(ngModel)]="soilType"
          name="soilType"
          [disabled]="isSubmitting"
        >
          <option *ngFor="let type of soilTypes" [value]="type">
            {{ type | titlecase }}
          </option>
        </select>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="isSubmitting"
      >
        {{ isSubmitting ? 'Adding...' : 'Add Field' }}
      </button>
    </form>
  </div>
</div>
